<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What Should I Do? — Activity Suggester</title>
  <link rel="preconnect" href="https://bored-api.appbrewery.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>What should I do?</h1>
      <p class="tagline">Beat the boredom. Get a suggestion tailored to your mood.</p>
    </header>

    <section class="filters" aria-label="Filters">
      <div class="field">
        <label for="type">Type</label>
        <select id="type">
          <option value="">Any type</option>
          <option value="education">Education</option>
          <option value="recreational">Recreational</option>
          <option value="social">Social</option>
          <option value="diy">DIY</option>
          <option value="charity">Charity</option>
          <option value="cooking">Cooking</option>
          <option value="relaxation">Relaxation</option>
          <option value="music">Music</option>
          <option value="busywork">Busywork</option>
        </select>
      </div>

      <div class="field">
        <label for="participants">Participants</label>
        <select id="participants">
          <option value="">Any number</option>
          <option value="1">Just me (1)</option>
          <option value="2">A pair (2)</option>
          <option value="3">A few (3)</option>
          <option value="4">A group (4)</option>
          <option value="5">A crowd (5+)</option>
        </select>
      </div>

      <div class="field">
        <label for="price">Budget</label>
        <select id="price">
          <option value="">Any budget</option>
          <option value="free">Free</option>
          <option value="low">Low cost</option>
          <option value="high">Splurge</option>
        </select>
      </div>

      <div class="field checkbox-field">
        <label for="kidFriendly">
          <input type="checkbox" id="kidFriendly" />
          Kid-friendly only
        </label>
      </div>
    </section>

    <div class="actions">
      <button id="suggest" class="btn-primary" type="button">Suggest an activity</button>
    </div>

    <section id="result" class="result" aria-live="polite"></section>
  </main>

  <footer class="credit">
    Activities from
    <a href="https://bored-api.appbrewery.com" target="_blank" rel="noopener noreferrer">Bored API</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
